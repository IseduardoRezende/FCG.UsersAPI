apiVersion: v1
kind: ConfigMap
metadata:
  name: fcg-users-config
  labels:
    app: fcg-users-api
data:
  ASPNETCORE_ENVIRONMENT: "Production"
  RabbitMq__Host: "rabbitmq"
  RabbitMq__VirtualHost: "/"
  TokenSettings__Issuer: "FCG.Users"
  TokenSettings__Audience: "FCG.Client"
  TokenSettings__DaysUntilExpires: "1"
