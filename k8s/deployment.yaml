apiVersion: apps/v1
kind: Deployment
metadata:
  name: fcg-users-api
  labels:
    app: fcg-users-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fcg-users-api
  template:
    metadata:
      labels:
        app: fcg-users-api
    spec:
      containers:
        - name: fcg-users-api
          image: fcg-users-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: fcg-users-config
            - secretRef:
                name: fcg-users-secret
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
