name: .NET

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore FCG.Users.slnx
    - name: Build
      run: dotnet build --no-restore FCG.Users.slnx
    - name: Unit tests
      run: dotnet test --no-build --project "05- Tests/FCG.Users.UnitTests/FCG.Users.UnitTests.csproj"
    - name: Integration tests (Testcontainers)
      run: dotnet test --no-build --project "05- Tests/FCG.Users.IntegrationTests/FCG.Users.IntegrationTests.csproj"
    - name: Docker build
      run: docker build -t fcg-users-api:ci .
